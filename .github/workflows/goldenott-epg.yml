name: GoldenOTT - guide EPG actualise
on:
  workflow_dispatch:
  push:
    paths:
      - 'goldenott/**'
      - '.github/workflows/goldenott-epg.yml'
  schedule:
    - cron: '18 3,15 * * *'
permissions:
  contents: write
concurrency:
  group: goldenott-epg
  cancel-in-progress: false
jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verifier les horaires et le repli EPG
        run: python3 -m unittest discover -s goldenott/scripts -p 'test_epg_*.py' -v
      - name: Construire guide EPG a partir de programmes reels
        run: python3 goldenott/scripts/build_epg.py
      - name: Publier uniquement le guide EPG et son etat
        run: |
          git config user.name 'GoldenOTT EPG Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add goldenott/guide.xml.gz goldenott/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualisation GoldenOTT EPG'
            git push
          fi
